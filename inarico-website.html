<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INARICO Business Solutions | Your Extended E-Commerce Business Team</title>
<meta name="description" content="INARICO helps consumer brands build, launch and scale digital commerce across Marketplaces, Quick Commerce, D2C and EPharmacy with complete P&L accountability.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --crimson: #70152B;
  --crimson-dark: #4A0B1A;
  --crimson-box: #4D0E1E;
  --navy: #1A365D;
  --navy-dark: #0E1B33;
  --navy-box: #132342;
  --blue-accent: #2563EB;
  --ink: #0F172A;
  --muted: #475569;
  --bg-page: #FFFFFF;
  --bg-subtle: #F8FAFC;
  --border-line: #E2E8F0;
  --dark-border: #233554;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
  --shadow-hover: 0 16px 32px -4px rgba(14,27,51,0.18), 0 8px 12px -4px rgba(14,27,51,0.1);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg-page);
  color: var(--ink);
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  font-size: 15.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: 'Manrope', sans-serif;
  color: var(--ink);
  font-weight: 800;
  line-height: 1.2;
  margin: 0 0 0.45em 0;
  letter-spacing: -0.025em;
}
h1 { font-size: clamp(2.2rem, 3.9vw, 3.2rem); line-height: 1.15; }
h2 { font-size: clamp(1.65rem, 2.7vw, 2.3rem); }
h3 { font-size: 1.25rem; }
p { margin: 0 0 0.95em; color: var(--muted); }

.w { max-width: 1220px; margin: auto; padding: 0 24px; }
.sec { padding: 64px 0; }
.bg-contrast { background-color: var(--bg-subtle); border-top: 1px solid var(--border-line); border-bottom: 1px solid var(--border-line); }
.single-line-heading { white-space: nowrap; }

/* Navbar */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-line);
}
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 84px;
  gap: 20px;
}
.brand-top {
  display: flex;
  align-items: center;
  text-decoration: none;
}
.brand-top img {
  height: 52px;
  width: auto;
  display: block;
}

nav { display: flex; align-items: center; gap: 26px; }
nav a {
  text-decoration: none;
  color: var(--ink);
  font-weight: 700;
  font-size: 0.94rem;
  transition: color 0.15s ease;
}
nav a:hover { color: var(--crimson); }
nav a.on { color: var(--crimson); border-bottom: 2px solid var(--crimson); padding-bottom: 3px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--crimson);
  color: #FFFFFF !important;
  padding: 12px 26px;
  border-radius: var(--radius-sm);
  text-decoration: none;
  font-weight: 700;
  font-size: 0.93rem;
  border: 1px solid var(--crimson);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  box-shadow: 0 3px 6px rgba(112, 21, 43, 0.2);
}
.btn:hover {
  background: var(--crimson-dark);
  border-color: var(--crimson-dark);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}
.btn-navy {
  background: var(--navy);
  border-color: var(--navy);
  color: #FFFFFF !important;
  box-shadow: 0 3px 6px rgba(26, 54, 93, 0.25);
}
.btn-navy:hover {
  background: #0E1B33;
  border-color: #0E1B33;
  transform: translateY(-2px);
}
.btn-outline { background: transparent; color: var(--ink) !important; border-color: var(--border-line); box-shadow: none; }
.btn-outline:hover { background: var(--bg-subtle); border-color: var(--muted); transform: none; }
.btn-light {
  background: #FFFFFF !important;
  color: #0E1B33 !important;
  border-color: #FFFFFF !important;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
}
.btn-light:hover {
  background: #F1F5F9 !important;
  color: #0A1324 !important;
  border-color: #F1F5F9 !important;
  transform: translateY(-2px);
}

/* Hero */
.hero {
  background: linear-gradient(135deg, #FFF8F9 0%, #F4F7FC 100%);
  padding: 60px 0 54px;
  border-bottom: 1px solid var(--border-line);
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 40px;
  align-items: center;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  background: #FFF;
  border: 1px solid rgba(112, 21, 43, 0.25);
  color: var(--crimson);
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 5px 14px;
  border-radius: 999px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.hero-img-box {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-hover);
  border: 1px solid var(--border-line);
}
.hero-img-box img {
  width: 100%;
  height: 390px;
  object-fit: cover;
  display: block;
}
.hero-img-tag {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  background: rgba(14, 27, 51, 0.94);
  backdrop-filter: blur(8px);
  color: #FFF;
  padding: 12px 18px;
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  display: flex;
  justify-content: space-between;
}

/* Metrics Ribbon */
.metrics-strip {
  background: var(--navy-dark);
  color: #FFF;
  padding: 26px 0;
  border-bottom: 3px solid var(--crimson);
}
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}
.metric-col {
  border-left: 2px solid rgba(255, 255, 255, 0.15);
  padding-left: 20px;
}
.metric-col:first-child { border-left: none; }
.metric-val {
  font-size: 1.95rem;
  font-weight: 800;
  color: #FFFFFF;
}
.metric-lbl {
  font-size: 0.82rem;
  color: #94A3B8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
}

/* Dark Colored Box Systems */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.dark-box {
  background: var(--navy-box);
  border: 1px solid var(--dark-border);
  border-radius: var(--radius-md);
  padding: 28px;
  color: #FFFFFF;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 12px rgba(14,27,51,0.18);
  position: relative;
  overflow: hidden;
}
.dark-box.crimson-box {
  background: var(--crimson-box);
  border-color: #6A1429;
}
.dark-box h3, .dark-box h4 { color: #FFFFFF; }
.dark-box p { color: #CBD5E1; font-size: 0.92rem; line-height: 1.55; }
.dark-box:hover {
  transform: translateY(-5px) scale(1.02);
  border-color: #60A5FA;
  box-shadow: 0 16px 32px rgba(14, 27, 51, 0.32);
}
.dark-box.crimson-box:hover {
  border-color: #F87171;
  box-shadow: 0 16px 32px rgba(112, 21, 43, 0.35);
}

.box-tag {
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 4px 12px;
  border-radius: 999px;
  display: inline-block;
  margin-bottom: 14px;
}
.box-tag.crimson { background: rgba(255, 255, 255, 0.15); color: #FFF; border: 1px solid rgba(255, 255, 255, 0.3); }
.box-tag.navy { background: rgba(255, 255, 255, 0.15); color: #FFF; border: 1px solid rgba(255, 255, 255, 0.3); }

/* Creative Omnichannel Showcase */
.eco-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.eco-box {
  background: var(--navy-box);
  border: 1px solid var(--dark-border);
  border-radius: var(--radius-md);
  padding: 30px;
  color: #FFFFFF;
  transition: all 0.3s ease;
}
.eco-box.crimson-variant {
  background: var(--crimson-box);
  border-color: #6A1429;
}
.eco-box:hover {
  transform: translateY(-4px);
  border-color: #60A5FA;
  box-shadow: 0 14px 28px rgba(14,27,51,0.3);
}
.eco-box.crimson-variant:hover {
  border-color: #F87171;
}
.eco-box h3 { color: #FFFFFF; margin: 0 0 10px; }
.eco-box p { color: #CBD5E1; font-size: 0.9rem; }
.eco-badge-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}
.eco-pill {
  font-size: 0.82rem;
  font-weight: 700;
  padding: 6px 13px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  color: #FFFFFF;
  border: 1px solid rgba(255, 255, 255, 0.16);
}

/* 4-Stage Framework */
.step-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}
.step-card {
  background: var(--navy-box);
  border: 1px solid var(--dark-border);
  border-radius: var(--radius-md);
  padding: 26px;
  color: #FFFFFF;
  transition: all 0.3s ease;
  cursor: pointer;
}
.step-card:hover {
  background: var(--crimson-box);
  border-color: #F87171;
  transform: translateY(-6px);
  box-shadow: 0 14px 28px rgba(112, 21, 43, 0.3);
}
.step-card h4 { color: #FFFFFF; margin-bottom: 8px; }
.step-card p { color: #CBD5E1; font-size: 0.88rem; margin: 0; }
.step-num {
  color: #93C5FD;
  font-size: 1.6rem;
  font-weight: 800;
  margin-bottom: 8px;
  transition: color 0.2s ease;
}
.step-card:hover .step-num { color: #FCA5A5; }

/* Subpage Header Banner */
.sub-banner {
  background: linear-gradient(135deg, #FFF8F9 0%, #F4F7FC 100%);
  border-bottom: 1px solid var(--border-line);
  padding: 48px 0;
}

/* Dual-Tone Banner for Specialized Channel Services */
.ops-banner {
  background: linear-gradient(135deg, var(--crimson-box) 0%, var(--navy-box) 100%);
  border-radius: var(--radius-lg);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #FFFFFF;
  padding: 44px;
  margin-bottom: 40px;
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  gap: 36px;
  align-items: center;
  box-shadow: var(--shadow-hover);
}
.ops-banner h2 { color: #FFFFFF !important; font-size: 2.1rem; line-height: 1.2; margin-bottom: 14px; }
.ops-banner p { color: #E2E8F0 !important; font-size: 1.02rem; margin-bottom: 24px; max-width: 58ch; }
.ops-gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.ops-gallery-item {
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.25);
  height: 140px;
  position: relative;
}
.ops-gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.ops-gallery-item span {
  position: absolute;
  bottom: 6px;
  left: 6px;
  right: 6px;
  background: rgba(14, 27, 51, 0.88);
  font-size: 0.74rem;
  font-weight: 700;
  padding: 3px 6px;
  border-radius: 4px;
  color: #FFF;
  text-align: center;
}

/* Industry & Sector Image Cards */
.sector-card {
  background: var(--navy-box);
  border: 1px solid var(--dark-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  color: #FFFFFF;
  transition: all 0.3s ease;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}
.sector-card.crimson-theme {
  background: var(--crimson-box);
  border-color: #6A1429;
}
.sector-card:hover {
  transform: translateY(-5px);
  border-color: #60A5FA;
  box-shadow: 0 16px 32px rgba(14, 27, 51, 0.3);
}
.sector-card.crimson-theme:hover {
  border-color: #F87171;
  box-shadow: 0 16px 32px rgba(112, 21, 43, 0.35);
}
.sector-img {
  width: 100%;
  height: 220px;
  object-fit: contain;
  background-color: #FFFFFF;
  display: block;
}
.sector-body { padding: 24px; flex: 1; }
.sector-body h3 { color: #FFFFFF; font-size: 1.25rem; margin-bottom: 8px; }
.sector-body p { color: #CBD5E1; font-size: 0.9rem; margin: 0; line-height: 1.55; }

/* 4-Stage Roadmap Command Center */
.roadmap-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}
.roadmap-item {
  display: grid;
  grid-template-columns: 260px 1fr 200px;
  background: var(--navy-box);
  border: 1px solid var(--dark-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  color: #FFFFFF;
  transition: all 0.25s ease;
}
.roadmap-item:hover {
  border-color: #60A5FA;
  box-shadow: 0 14px 28px rgba(14, 27, 51, 0.35);
  transform: translateY(-2px);
}
.roadmap-badge {
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  color: #FFF;
}
.rm-stage-1 { background: linear-gradient(135deg, #70152B 0%, #4D0E1E 100%); }
.rm-stage-2 { background: linear-gradient(135deg, #1A365D 0%, #132342 100%); }
.rm-stage-3 { background: linear-gradient(135deg, #0E7490 0%, #0F374A 100%); }
.rm-stage-4 { background: linear-gradient(135deg, #475569 0%, #1E293B 100%); }
.roadmap-content { padding: 28px 34px; display: flex; flex-direction: column; justify-content: center; }
.roadmap-content b { font-size: 1.15rem; color: #FFFFFF; margin-bottom: 8px; }
.roadmap-content p { color: #CBD5E1; font-size: 0.92rem; margin: 0; }
.roadmap-meta {
  background: #0A1424;
  border-left: 1px solid var(--dark-border);
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.roadmap-meta b { font-size: 1.15rem; color: #60A5FA; }

/* Contact Form */
form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  max-width: 820px;
}
.form-full { grid-column: 1 / -1; }
label {
  display: block;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 5px;
}
input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  font: inherit;
  font-size: 0.94rem;
  border: 1px solid var(--border-line);
  border-radius: var(--radius-sm);
  background: #FFFFFF;
  color: var(--ink);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--crimson);
  box-shadow: 0 0 0 3px rgba(112, 21, 43, 0.12);
}
.err { color: #DC2626; font-size: 0.8rem; margin-top: 3px; display: block; font-weight: 600; }
.notice { background: var(--bg-subtle); border: 1px solid var(--border-line); padding: 14px; border-radius: var(--radius-sm); font-size: 0.9rem; }
.hp { position: absolute; left: -9999px; }

/* Footer */
footer {
  background: var(--navy-dark);
  color: #94A3B8;
  border-top: 1px solid #1E2D4A;
  padding: 56px 0 34px;
  font-size: 0.92rem;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1.1fr 1.2fr;
  gap: 36px;
}
footer h4 { color: #FFFFFF; font-size: 0.94rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
footer a { color: #94A3B8; text-decoration: none; display: block; margin-bottom: 9px; transition: color 0.15s; }
footer a:hover { color: #FFFFFF; }
.footer-brand-box {
  background: #FFFFFF;
  padding: 10px 16px;
  border-radius: 8px;
  display: inline-block;
  margin-bottom: 16px;
}
.footer-brand-img {
  height: 42px;
  width: auto;
  display: block;
}

#mobile-toggle { display: none; background: transparent; border: 1px solid var(--border-line); padding: 8px 12px; border-radius: 6px; cursor: pointer; }

@media(max-width: 920px) {
  .hero-grid, .footer-grid, form, .grid-3, .step-grid, .metrics-grid, .eco-container, .ops-banner, .roadmap-item { grid-template-columns: 1fr; }
  .single-line-heading { white-space: normal; }
  .metric-col { border-left: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 0 12px 0; }
  #mobile-toggle { display: block; }
  nav {
    display: none;
    position: absolute;
    top: 84px;
    left: 0;
    right: 0;
    background: #FFFFFF;
    flex-direction: column;
    padding: 24px;
    border-bottom: 1px solid var(--border-line);
    gap: 16px;
    box-shadow: var(--shadow-hover);
  }
  nav.open { display: flex; }
  .sec { padding: 44px 0; }
}
.crimson-box .btn-navy{box-shadow:0 0 0 1px rgba(255,255,255,.4),0 3px 6px rgba(26,54,93,.25)}
</style>
</head>
<body>

<header>
  <div class="w navbar">

function initContactForm() {
  var form = document.querySelector("#contact-form");
  if (!form) return;
  form.onsubmit = function(e) {
    e.preventDefault();
    var errors = 0;
    function setE(id, msg) {
      document.querySelector("#err-" + id).textContent = msg || "";
      if (msg) errors++;
    }
    function val(id) { return form[id].value.trim(); }

    setE("name", val("name") ? "" : "Full name is required.");
    setE("email", /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val("email")) ? "" : "Valid corporate email is required.");
    setE("company", val("company") ? "" : "Company name is required.");
    setE("designation", val("designation") ? "" : "Designation is required.");
    setE("service_interest", form.service_interest.value ? "" : "Please select an area of interest.");
    setE("consent", document.querySelector("#consent").checked ? "" : "Please acknowledge consent.");

    if (errors || form.bot_check.value) return;

    var fb = document.querySelector("#form-feedback");
    fb.innerHTML = '<div class="notice" style="border-color:var(--navy);color:var(--navy);margin-top:14px;">Your details are validated. Inquiries can also be forwarded directly to <b>' + CONFIG.email + '</b>.</div>';
  };
}

function render() {
  var hash = location.hash.replace(/^#/, "") || "/";
  var parts = hash.split("/");
  var seg = parts[1] || "";
  var sub = parts[2] || "";
  var content = "";

  if (seg === "" || seg === "home") content = getHomePage();
  else if (seg === "about") content = getAboutPage();
  else if (seg === "services") content = getServicesPage();
  else if (seg === "expertise") content = getExpertisePage();
  else if (seg === "approach") content = getApproachPage();
  else if (seg === "contact") { content = getContactPage(); }
  else {
    content = '<section class="sec"><div class="w"><h2>Page Not Found</h2><p>The requested page does not exist.</p><a class="btn" href="#/">Return Home</a></div></section>';
  }

  document.querySelector("#main-content").innerHTML = content;
  if (seg === "contact") initContactForm();

  // Render navigation bar
  var cur = "#/" + seg;
  var navHtml = "";
  for (var i = 0; i < NAV_LINKS.length; i++) {
    var item = NAV_LINKS[i];
    var isCurrent = (item[0] === cur) || (seg === "" && item[0] === "#/");
    navHtml += '<a href="' + item[0] + '" class="' + (isCurrent ? 'on' : '') + '">' + item[1] + '</a>';
  }
  navHtml += '<a class="btn" href="#/contact">Discuss Business</a>';
  document.querySelector("#main-nav").innerHTML = navHtml;
  document.querySelector("#main-nav").classList.remove("open");

  if (sub) {
    var target = document.getElementById(sub);
    if (target) { target.scrollIntoView(); return; }
  }
  window.scrollTo(0, 0);
}

document.querySelector("#mobile-toggle").onclick = function() {
  var nav = document.querySelector("#main-nav");
  nav.classList.toggle("open");
};
